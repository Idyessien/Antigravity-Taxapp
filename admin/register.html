{% extends "base.html" %}

{% block guest_content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0" style="border-radius: 16px; background: var(--glass-bg, #ffffff); backdrop-filter: blur(15px);">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3 shadow-sm" 
                         style="width: 64px; height: 64px; background: linear-gradient(135deg, #0f766e 0%, #115e59 100%); color: #5eead4;">
                        <i class="bi bi-person-badge-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Admin Registration</h3>
                    <p class="text-muted small">Register or elevate master privileges for TaxOnTheGo</p>
                    
                    <div class="alert alert-info py-2 px-3 small border-0 shadow-sm mt-2 text-start">
                        <i class="bi bi-info-circle-fill me-1"></i> <strong>Strict Access Policy:</strong> Only <code>idyessien101@gmail.com</code> is authorized to register for administrative privileges.
                    </div>
                </div>

                <form method="POST" action="{{ url_for('admin.admin_register') }}">
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold text-uppercase">Authorized Admin Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="bi bi-envelope-fill text-muted"></i></span>
                            <input type="email" name="email" class="form-control form-control-lg bg-light border-0" 
                                   required value="idyessien101@gmail.com" readonly style="cursor: not-allowed; opacity: 0.9;">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold text-uppercase">Choose Admin Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="bi bi-key-fill text-muted"></i></span>
                            <input type="password" name="password" class="form-control form-control-lg bg-light border-0" 
                                   required minlength="6" placeholder="At least 6 characters">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold text-uppercase">Base Profile Context</label>
                        <select name="profile_type" class="form-select form-select-lg bg-light border-0">
                            <option value="Individual" selected>Individual</option>
                            <option value="Small Business">Small Business</option>
                            <option value="Corporation">Corporation</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-teal btn-lg w-100 fw-bold shadow-sm mb-3 text-white" 
                            style="background: linear-gradient(135deg, #0f766e 0%, #115e59 100%);">
                        <i class="bi bi-check-circle-fill me-2"></i> Confirm Admin Credentials
                    </button>
                    
                    <div class="text-center pt-3 border-top">
                        <a href="{{ url_for('admin.admin_login') }}" class="small fw-bold text-decoration-none text-muted">
                            <i class="bi bi-arrow-left me-1"></i> Return to Admin Login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
